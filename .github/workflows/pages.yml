name: Publish comparison site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build compact static site
        run: python3 scripts/build_pages_bundle.py --repo . --out "$RUNNER_TEMP/site" --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
